{% from 'schematic-symbols.html' import diagram_definitions, schematic_legend, bias_chip, math_symbol, vertical_resistor, coupling_capacitor, npn_symbol, dc_flow %}
{% set ac_tracks = [('input', 'M123 124H161', 'blue'), ('output', 'M414 104H455', 'green')] %}
<svg id="circuit-svg" class="reference-circuit" viewBox="0 0 550 235" role="img" aria-labelledby="circuit-title circuit-description">
  <title id="circuit-title">Voltage-divider common-emitter circuit</title>
  <desc id="circuit-description">2N3904 NPN with voltage-divider bias, optional emitter bypass capacitor, input and output coupling capacitors, and load. The blue and green waveforms share a time window from the transient results.</desc>
  {{ diagram_definitions() }}
  {{ schematic_legend(true) }}

  <g class="circuit-wire" fill="none" stroke="#263238" stroke-width="1.62" stroke-linecap="round" stroke-linejoin="round">
    <path id="supply-rail" d="M330 4V21H237V44M330 21V44"/>
    <circle cx="330" cy="4" r="2.15" fill="#fff"/>
    {{ vertical_resistor('divider-upper', 237, 44, 83) }}
    {{ vertical_resistor('collector-resistor', 330, 44, 83) }}
    <path d="M237 83V154M330 83V104M237 124H302"/>
    {{ vertical_resistor('divider-lower', 237, 154, 187) }}
    <path d="M237 187V216"/>

    <path id="input-route" d="M117 143V124H168M175 124H237M117 169V183"/>
    {{ coupling_capacitor('input-capacitor', 168, 175, 124) }}
    <circle cx="117" cy="156" r="13" fill="#dbf2fa"/>
    <path class="source-sine" d="M108 156c3-9 6-9 9 0s6 9 9 0"/>

    {{ npn_symbol() }}
    <path d="M330 154V172"/>
    {{ vertical_resistor('emitter-resistor', 330, 172, 202) }}
    <path id="emitter-ground-lead" d="M330 202V216"/>

    <path id="output-route" d="M330 104H402M409 104H461V132"/>
    {{ coupling_capacitor('output-capacitor', 402, 409, 104) }}
    {{ vertical_resistor('load-resistor', 461, 132, 163) }}
    <path d="M461 163V183"/>

    <use href="#ground" x="117" y="183"/>
    <use href="#ground" x="237" y="216"/>
    <use href="#ground" x="330" y="216"/>
    <use href="#ground" x="461" y="183"/>
  </g>

  <g data-emitter-bypass visibility="{{ 'visible' if bypass_enabled else 'hidden' }}">
    <title>Emitter bypass capacitor across RE</title>
    <g class="circuit-wire" fill="none" stroke="#263238" stroke-width="1.62" stroke-linecap="round" stroke-linejoin="round">
      <path id="emitter-bypass-route" d="M330 154H366V184M366 191V216"/>
      <path id="emitter-bypass-capacitor" d="M357 184H375M357 191H375"/>
      <use href="#ground" x="366" y="216"/>
    </g>
    <g class="component-labels" fill="#202b31">
      <text x="378" y="185">{{ math_symbol('C', 'E') }}</text>
      <text class="component-value" x="378" y="200"><tspan data-bypass-value>{{ '%.4g'|format(values.ce|float) }}</tspan> µF</text>
    </g>
  </g>

  <g class="component-labels" fill="#202b31">
    {% for key, symbol, subscript, x, y, anchor, unit in [
      ('r1', 'R', '1', 224, 55, 'end', 'kΩ'),
      ('r2', 'R', '2', 224, 175, 'end', 'kΩ'),
      ('rc', 'R', 'C', 315, 55, 'end', 'kΩ'),
      ('re', 'R', 'E', 316, 183, 'end', 'kΩ'),
      ('cin', 'C', 'in', 170, 95, 'middle', 'µF'),
      ('cout', 'C', 'out', 427, 79, 'middle', 'µF'),
      ('rl', 'R', 'L', 477, 144, 'start', 'kΩ')
    ] %}
    <g text-anchor="{{ anchor }}">
      <text x="{{ x }}" y="{{ y }}">{{ math_symbol(symbol, subscript) }}</text>
      <text class="component-value" x="{{ x }}" y="{{ y + 14 }}"><tspan data-spice-value="{{ key }}">{{ values[key] }}</tspan> {{ unit }}</text>
    </g>
    {% endfor %}
    <text x="87" y="156" text-anchor="middle">{{ math_symbol('v', 'in') }}</text>
    <g class="device-labels" text-anchor="middle">
      <text x="358" y="119">{{ math_symbol('Q', '1') }}</text>
      <text class="device-type" x="358" y="132">NPN</text>
      <text class="device-model" x="358" y="144">2N3904</text>
    </g>
  </g>

  <g class="supply-label">
    <rect x="342" y="0.5" width="76" height="18.5" rx="2.7"/>
    <text x="349" y="13.2">{{ math_symbol('V', 'CC') }} = <tspan data-spice-value="vcc">{{ values.vcc }}</tspan> V</text>
  </g>

  <g class="dc-layer">
    {{ dc_flow() }}
    <g class="current-label" data-dc-badge visibility="hidden">
      <text x="348" y="40">{{ math_symbol('I', 'C') }}<tspan data-current-ic></tspan></text>
      <text x="244" y="209">{{ math_symbol('I', 'E') }}<tspan data-current-ie></tspan></text>
    </g>
    <g data-dc-badge visibility="hidden" class="voltage-leaders" fill="none" stroke="#bf629b" stroke-width=".85">
      <path d="M237 124l10-17M330 104l18-31m-18 81-11 3"/>
    </g>
    {% for key, subscript, x, y, width in [('vb','B',243,92,64),('vc','C',343,57,66),('ve','E',256,148,65)] %}
    <g data-dc-badge visibility="hidden" class="node-badge">
      <rect x="{{ x }}" y="{{ y }}" width="{{ width }}" height="16" rx="3"/>
      <text x="{{ x + 5 }}" y="{{ y + 11.7 }}">{{ math_symbol('V', subscript) }}<tspan data-dc-node="{{ key }}"></tspan></text>
    </g>
    {% endfor %}
    <g data-dc-badge visibility="hidden" class="q-point">
      <rect x="390" y="132" width="60" height="39" rx="4.3"/>
      <text x="397" y="144">Q-Point:</text>
      <text x="395.5" y="155" textLength="52" lengthAdjust="spacingAndGlyphs">{{ math_symbol('I', 'C') }}<tspan data-dc-current></tspan></text>
      <text x="395.5" y="166" textLength="52" lengthAdjust="spacingAndGlyphs">{{ math_symbol('V', 'CE') }}<tspan data-dc-vce></tspan></text>
    </g>
  </g>

  <g class="ac-layer" fill="none">
    <g data-tran-badge visibility="hidden">
      <g class="signal-wire-glow" filter="url(#signal-glow)" stroke-width="4">
        {% for branch, route, color in ac_tracks %}<path class="signal-{{ color }}" d="{{ route }}"/>{% endfor %}
        <path class="signal-green" d="M463 104H476"/>
      </g>
      <g class="signal-wire">
        {% for branch, route, color in ac_tracks %}<path class="signal-{{ color }}" d="{{ route }}" marker-end="url(#arrow-{{ color }})"/>{% endfor %}
        <path class="signal-green" d="M463 104H476" marker-end="url(#arrow-green)"/>
      </g>
      <g class="ac-motion" aria-hidden="true">
        {% for branch, route, color in ac_tracks %}<path class="flow-path signal-{{ color }}" data-pulse="{{ branch }}" d="{{ route }}" pathLength="100"/>{% endfor %}
      </g>
      <g class="wave-glow" filter="url(#signal-glow)" aria-hidden="true">
        <use href="#input-wave"/><use href="#output-wave"/>
      </g>
      <polyline id="input-wave" class="signal-blue" data-signal-wave="vin" data-wave-x="183" data-wave-width="49" data-wave-y="124"/>
      <polyline id="output-wave" class="signal-green" data-signal-wave="vout" data-wave-x="479" data-wave-width="61" data-wave-y="104"/>
      <path class="output-leader" d="M477 79l-6 18m-1-4 1 4 3-3"/>
    </g>
    <g class="signal-label input-signal">
      <rect x="23" y="87" width="85" height="44" rx="5"/>
      <text class="signal-title" x="65.5" y="101">Input Signal</text>
      {% set input_unit = source_units.amplitude.get(values.amplitude_unit, source_units.amplitude.mV)[0] %}
      <text x="65.5" y="113">{{ math_symbol('v', 'in') }} (<tspan data-source-amplitude>{{ '%.4g'|format(values.amplitude|float) }}</tspan> <tspan data-source-amplitude-unit>{{ input_unit|replace(' peak', '') }}</tspan><tspan class="schematic-subscript">peak</tspan>)</text>
      <text x="65.5" y="124"><tspan class="schematic-variable">f</tspan><tspan data-source-frequency> = {{ '%.4g'|format(values.frequency|float) }} {{ values.frequency_unit if values.frequency_unit in source_units.frequency else 'Hz' }}</tspan></text>
    </g>
    <g class="signal-label output-signal">
      <rect x="452" y="36" width="89" height="43" rx="5"/>
      <text class="signal-title" x="496.5" y="50">Output Signal</text>
      <g data-signal-reading visibility="hidden">
        <text x="496.5" y="62">{{ math_symbol('v', 'out') }}<tspan data-output-amplitude></tspan><tspan class="schematic-subscript">peak</tspan></text>
        <text x="496.5" y="73">|{{ math_symbol('A', 'v') }}|<tspan data-output-gain></tspan></text>
      </g>
      <text x="496.5" y="66" data-signal-empty>Run transient</text>
    </g>
  </g>

  <g class="key-nodes" fill="#fff" stroke="#c646a2" stroke-width="1.7">
    <circle data-node="base" cx="237" cy="124" r="2.65"/>
    <circle data-node="collector" cx="330" cy="104" r="2.65"/>
    <circle data-node="emitter" cx="330" cy="154" r="2.65"/>
    <circle data-node="output" cx="461" cy="104" r="2.65" stroke="#8a55bf"/>
    <circle data-node="supply" cx="330" cy="21" r="2.4" stroke="#dc6559"/>
  </g>
  {{ bias_chip('Voltage Divider Bias', '(Common Emitter)') }}
</svg>
